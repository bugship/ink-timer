<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Answer Bell</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Answer Bell</h1>
  <p>Pick a duration. Write like the clock is a exam invigilator.</p>
  <div class="presets">
    <button data-m="7">7 min</button>
    <button data-m="10">10 min</button>
    <button data-m="15">15 min</button>
  </div>
  <div id="display">00:00</div>
  <button id="stop">Stop</button>
  <p id="status">Idle</p>
  <script src="bell.js"></script>
</body>
</html>
